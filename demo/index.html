<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>persona-memory · demo</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #262b36;
    --text: #e6e8ec;
    --dim: #8b93a3;
    --accent: #6ea8fe;
    --good: #4ade80;
    --warn: #fbbf24;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; display: flex;
    background: var(--bg); color: var(--text);
    font: 14px/1.6 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
  }
  /* 左：聊天 */
  .chat { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .head {
    padding: 14px 20px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 10px;
  }
  .head h1 { font-size: 15px; margin: 0; font-weight: 600; }
  .head .tag { font-size: 12px; color: var(--dim); }
  .msgs {
    flex: 1; overflow-y: auto; padding: 20px;
    display: flex; flex-direction: column; gap: 12px;
  }
  .msg { max-width: 78%; padding: 9px 13px; border-radius: 12px; white-space: pre-wrap; word-break: break-word; }
  .msg.me { align-self: flex-end; background: #2a3550; border-bottom-right-radius: 4px; }
  .msg.bot { align-self: flex-start; background: var(--panel); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
  .msg.sys { align-self: center; font-size: 12px; color: var(--warn); background: transparent; padding: 2px; }
  .inputbar { padding: 14px 20px; border-top: 1px solid var(--border); display: flex; gap: 10px; }
  .inputbar input {
    flex: 1; background: var(--panel); border: 1px solid var(--border);
    color: var(--text); padding: 10px 14px; border-radius: 8px; outline: none; font-size: 14px;
  }
  .inputbar input:focus { border-color: var(--accent); }
  .inputbar button {
    background: var(--accent); color: #06101f; border: 0; padding: 10px 20px;
    border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 14px;
  }
  .inputbar button:hover { filter: brightness(1.08); }
  .inputbar button:disabled { opacity: .5; cursor: default; }
  /* 右：关系面板 */
  .side {
    width: 340px; border-left: 1px solid var(--border);
    display: flex; flex-direction: column; overflow-y: auto;
  }
  .box { padding: 16px 18px; border-bottom: 1px solid var(--border); }
  .box h2 { font-size: 12px; margin: 0 0 12px; color: var(--dim); font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
  .big { font-size: 30px; font-weight: 700; line-height: 1.1; }
  .sub { color: var(--dim); font-size: 12px; margin-top: 4px; }
  .bar { height: 6px; background: #222733; border-radius: 3px; margin-top: 12px; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: linear-gradient(90deg, #6ea8fe, #4ade80); transition: width .35s ease; }
  .row { display: flex; justify-content: space-between; font-size: 13px; padding: 3px 0; }
  .row span:last-child { color: var(--text); font-variant-numeric: tabular-nums; }
  .row span:first-child { color: var(--dim); }
  .prompt {
    background: #0b0d11; border: 1px solid var(--border); border-radius: 8px;
    padding: 11px 13px; font: 12px/1.65 "Cascadia Code", Consolas, monospace;
    color: #9fb4d8; white-space: pre-wrap; word-break: break-word; min-height: 40px;
  }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag-pill {
    font-size: 12px; padding: 3px 9px; border-radius: 999px;
    background: #23304a; color: #9fc0ff; border: 1px solid #2f3f5e;
  }
  .btn {
    width: 100%; margin-top: 10px; background: var(--panel); color: var(--text);
    border: 1px solid var(--border); padding: 8px; border-radius: 7px; cursor: pointer; font-size: 13px;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .empty { color: var(--dim); font-size: 13px; font-style: italic; }
</style>
</head>
<body>
  <div class="chat">
    <div class="head">
      <h1>persona-memory</h1>
      <span class="tag">关系状态层 demo · 回复由好感度档位决定</span>
    </div>
    <div class="msgs" id="msgs">
      <div class="msg bot">你好。你是第一次来吧？（当前档位：生疏）</div>
    </div>
    <div class="inputbar">
      <input id="inp" placeholder="说点什么…（夸她、@她、聊几句，好感度会涨）" autocomplete="off">
      <button id="send">发送</button>
    </div>
  </div>

  <aside class="side">
    <div class="box">
      <h2>好感度</h2>
      <div class="big" id="aff-val">0</div>
      <div class="sub" id="aff-tier">生疏</div>
      <div class="bar"><i id="aff-bar" style="width:0%"></i></div>
    </div>

    <div class="box">
      <h2>说话风格（本地统计）</h2>
      <div class="row"><span>消息数</span><span id="st-count">0</span></div>
      <div class="row"><span>平均字数</span><span id="st-len">0</span></div>
      <div class="row"><span>问句率</span><span id="st-q">0%</span></div>
      <div class="row"><span>夜间活跃</span><span id="st-night">0%</span></div>
    </div>

    <div class="box">
      <h2>状态标签</h2>
      <div class="tags" id="tags"><span class="empty">还没有标签</span></div>
    </div>

    <div class="box">
      <h2>实际注入给模型的文本</h2>
      <div class="prompt" id="block">（空）</div>
    </div>

    <div class="box">
      <h2>操作</h2>
      <button class="btn" id="skip">跳过 1 天（看衰减）</button>
    </div>
  </aside>

<script>
const $ = (id) => document.getElementById(id);
const userId = 'visitor';
let busy = false;

function addMsg(text, cls) {
  const d = document.createElement('div');
  d.className = 'msg ' + cls;
  d.textContent = text;
  $('msgs').appendChild(d);
  $('msgs').scrollTop = $('msgs').scrollHeight;
}

function render(state) {
  const p = state.profile;
  const block = state.block || '';
  if (p) {
    $('aff-val').textContent = Math.round(p.affinity.value);
    $('aff-tier').textContent = p.affinity.tier;
    $('aff-bar').style.width = Math.max(0, Math.min(100, p.affinity.value)) + '%';
    $('st-count').textContent = p.style.count;
    $('st-len').textContent = p.style.avgChars;
    $('st-q').textContent = p.style.questionRate + '%';
    $('st-night').textContent = p.style.nightRate + '%';

    const tags = $('tags');
    tags.innerHTML = '';
    if (p.tags.length) {
      for (const t of p.tags) {
        const s = document.createElement('span');
        s.className = 'tag-pill';
        s.textContent = t.tag + (t.longTerm ? ' ·长期' : '');
        tags.appendChild(s);
      }
    } else {
      tags.innerHTML = '<span class="empty">还没有标签</span>';
    }
  }
  $('block').textContent = block || '（空 —— 还没有足够互动）';
}

async function refresh() {
  const r = await fetch('/api/state?userId=' + encodeURIComponent(userId));
  const j = await r.json();
  if (j.ok) render(j);
}

async function send() {
  const inp = $('inp');
  const text = inp.value.trim();
  if (!text || busy) return;
  busy = true;
  $('send').disabled = true;
  inp.value = '';
  addMsg(text, 'me');

  try {
    const r = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ userId, text }),
    });
    const j = await r.json();
    if (!j.ok) { addMsg('出错了：' + j.error, 'sys'); return; }

    if (j.tierChanged) addMsg(`关系升级：${j.tierBefore} → ${j.profile.affinity.tier}`, 'sys');
    if (j.delta) addMsg(`好感度 ${j.delta > 0 ? '+' : ''}${j.delta}`, 'sys');

    addMsg(j.reply, 'bot');
    render({ profile: j.profile, block: j.block });
  } catch (e) {
    addMsg('网络错误：' + e.message, 'sys');
  } finally {
    busy = false;
    $('send').disabled = false;
    inp.focus();
  }
}

$('send').onclick = send;
$('inp').addEventListener('keydown', (e) => { if (e.key === 'Enter') send(); });
$('skip').onclick = async () => {
  const r = await fetch('/api/maintain', {
    method: 'POST',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ days: 1 }),
  });
  const j = await r.json();
  addMsg(`（跳过一天：衰减 ${j.decayed} 人，过期标签 ${j.expired} 个）`, 'sys');
  refresh();
};

refresh();
</script>
</body>
</html>
