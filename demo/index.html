<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>persona-memory · 关系观察室</title>
<style>
:root{font:15px/1.65 system-ui,"Microsoft YaHei",sans-serif;color:#19352f;background:#f4f6f2}
*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer}
header{padding:28px 4vw 20px;border-bottom:1px solid #dce4db;display:flex;justify-content:space-between;align-items:center;gap:20px}
header h1{font-size:23px;margin:0;font-weight:650;letter-spacing:-.6px}header p{color:#6b7d74;font-size:13px;margin:5px 0 0}
.badge{font-size:12px;border:1px solid #bdcfbf;border-radius:30px;padding:5px 12px;background:#e9f0e7;white-space:nowrap}
main{display:grid;grid-template-columns:180px minmax(280px,1fr) 340px;gap:22px;max-width:1440px;margin:auto;padding:26px 4vw}
nav button{display:block;border:0;background:none;color:#657c6c;width:100%;text-align:left;border-radius:9px;padding:12px 14px;margin:3px 0}
nav button.active{color:#fff;background:#254f40}nav small{display:block;margin:25px 10px;color:#7b897f}
.panel{background:#fff;border:1px solid #dce4db;border-radius:15px;padding:22px}h2{font-size:14px;letter-spacing:.3px;margin:0 0 16px;color:#607567}
#chat{height:330px;overflow:auto;display:flex;flex-direction:column;gap:12px;padding:4px}
.bubble{background:#f1f5ee;border-radius:12px;padding:12px 15px;max-width:90%;white-space:pre-wrap}.bubble.user{align-self:flex-end;background:#e4eee7}
.note{color:#78897d;font-size:12px;margin:15px 0}form{display:flex;gap:9px;border-top:1px solid #e8ede6;padding-top:16px}input{min-width:0;flex:1;border:1px solid #ccd9cc;border-radius:9px;padding:10px 12px;background:#fbfcf9}
button.primary{border:0;border-radius:9px;background:#254f40;color:white;padding:8px 18px}.actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px}.actions button{border:1px solid #d6dfd2;background:#f9faf6;border-radius:7px;padding:6px 10px;font-size:12px;color:#526b57}
.score{font-size:38px;font-weight:650;line-height:1.2}.muted{color:#829080;font-size:12px}#tags{margin-top:13px}.pill{display:inline-block;background:#edf2e7;color:#4b6844;font-size:12px;padding:4px 8px;border-radius:6px;margin:2px}
pre{white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.7 ui-monospace,Consolas,monospace;color:#415e49;background:#f4f6f0;padding:12px;border-radius:8px;min-height:40px}.stack{display:grid;gap:16px;align-content:start}.row{display:flex;justify-content:space-between;margin:7px 0;font-size:13px}
#comparison{border-left:3px solid #c8d4b8;padding-left:12px;color:#74816a;font-size:13px;margin:15px 0}
#error{color:#ab4535;min-height:20px;font-size:13px}button:focus-visible,input:focus-visible{outline:3px solid #9abb88;outline-offset:2px}
@media(max-width:1050px){main{grid-template-columns:150px 1fr}.stack{grid-column:2}}
@media(max-width:650px){header{align-items:flex-start}.badge{display:none}main{display:block;padding:16px}nav{display:flex;gap:3px;margin-bottom:15px}nav button{text-align:center;padding:9px 3px}nav small{display:none}.stack{margin-top:16px}.panel{padding:17px}}
</style></head><body>
<header><div><h1>persona-memory <span style="font-weight:400;color:#81917d">/ 关系观察室</span></h1><p>观察关系怎样积累，状态怎样过期，以及哪些记忆进入了这一轮上下文。</p></div><span class="badge">本地规则演示 · 无模型调用</span></header>
<main><nav aria-label="场景"><button data-scene="community" class="active">社群聊天</button><button data-scene="companion">日常陪伴</button><button data-scene="support">客服跟进</button><button data-scene="npc">游戏 NPC</button><small>切换场景，各自保留状态。<br>预览不会增加记忆使用次数。</small></nav>
<section class="panel"><h2 id="scene-title">社群聊天</h2><div id="chat" aria-live="polite"><div class="bubble">试着说“今天好累”，再推进时间，看看状态发生什么变化。</div></div>
<div id="comparison">未使用关系记忆的规则回复会显示在这里。</div><form id="form"><input id="input" aria-label="聊天内容" autocomplete="off" placeholder="说点什么，观察右侧的变化…" maxlength="2000"><button class="primary">发送</button></form>
<div class="actions" id="actions"></div><p class="note" id="explanation">右侧只是关系状态。这里的回复由规则生成，不能用来证明模型回答变好了。</p><div id="error" role="alert"></div></section>
<aside class="stack"><section class="panel"><h2>当前关系</h2><div class="score" id="score">0</div><div class="muted" id="tier">还没有建立档案</div><div class="row"><span>熟悉程度 / 信任</span><span id="dimensions">未启用</span></div><div class="row"><span>模拟日期</span><span id="date">—</span></div><div id="tags"></div></section>
<section class="panel"><h2>这一轮的上下文</h2><pre id="context">暂无</pre><div class="muted" id="budget">0 / 700 字符</div><h2 style="margin-top:17px">来源与选择原因</h2><pre id="evidence">暂无</pre></section></aside></main>
<script>
let scene='community';const names={community:'社群聊天',companion:'日常陪伴',support:'客服跟进',npc:'游戏 NPC'};
const $=id=>document.getElementById(id);
async function api(route,body){const r=await fetch('/api/'+route+'?scenario='+scene,body?{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)}:{});const v=await r.json();if(!r.ok)throw Error(v.error);return v}
function bubble(text,user=false){const e=document.createElement('div');e.className='bubble'+(user?' user':'');e.textContent=text;$('chat').append(e);$('chat').scrollTop=$('chat').scrollHeight}
function render(s){const p=s.profile;$('score').textContent=p?.affinity.value??0;$('tier').textContent=p?.affinity.tier??'还没有建立档案';$('date').textContent=new Date(s.now).toLocaleDateString('zh-CN');$('context').textContent=s.context.text||'暂无可用关系记忆';$('budget').textContent=s.context.characters+' / '+s.context.budget+' 字符';
$('dimensions').textContent=p&&Object.keys(p.dimensions).length?Object.entries(p.dimensions).map(([n,d])=>(n==='trust'?'信任':'熟悉')+' '+Math.round(d.value)).join(' / '):'未启用';
$('tags').replaceChildren();for(const t of p?.tags??[]){const e=document.createElement('span');e.className='pill';e.textContent=t.tag+(t.longTerm?' · 长期':' · 临时');$('tags').append(e)}
$('evidence').textContent=JSON.stringify({选择:s.context.people.map(p=>({用户:p.userId,原因:p.reason,状态:p.tags.map(t=>({名称:t.tag,来源:t.source,使用次数:t.injections}))})),省略:s.context.omitted},null,2)}
async function refresh(){try{render(await api('state'));$('error').textContent=''}catch(e){$('error').textContent=e.message}}
function actions(){const list=[['advance-day','推进一天'],['reset','清除当前场景']];if(scene==='support')list.unshift(['unresolved','标记待跟进'],['resolved','标记已解决']);if(scene==='npc')list.unshift(['promise-kept','履行约定：信任 +10'],['promise-broken','违背约定：信任 -10']);$('actions').replaceChildren();for(const [action,title]of list){const b=document.createElement('button');b.textContent=title;b.onclick=async()=>{try{render(await api('action',{action}));bubble('已执行：'+title)}catch(e){$('error').textContent=e.message}};$('actions').append(b)}}
for(const b of document.querySelectorAll('[data-scene]'))b.onclick=()=>{scene=b.dataset.scene;document.querySelectorAll('[data-scene]').forEach(e=>e.classList.toggle('active',e===b));$('scene-title').textContent=names[scene];$('chat').replaceChildren();bubble('已切换到'+names[scene]+'。');actions();refresh()};
$('form').onsubmit=async e=>{e.preventDefault();const text=$('input').value.trim();if(!text)return;const button=e.currentTarget.querySelector('button');button.disabled=true;bubble(text,true);$('input').value='';try{const s=await api('chat',{text});render(s);bubble(s.reply);$('comparison').textContent='没有关系记忆的规则回复：'+s.withoutMemory;$('error').textContent=''}catch(e){$('error').textContent=e.message}finally{button.disabled=false}};
actions();refresh();
</script></body></html>
